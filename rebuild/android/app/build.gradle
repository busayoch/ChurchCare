plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.churchcare.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.churchcare.app'
        minSdk 23
        targetSdk 35
        versionCode 16
        versionName '0.7.2-foundation'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('CHURCHCARE_KEYSTORE_FILE')
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
            }
            storePassword System.getenv('CHURCHCARE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('CHURCHCARE_KEY_ALIAS')
            keyPassword System.getenv('CHURCHCARE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    // Keep the existing Google Play Services authorization dependency for Drive.
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Firebase Authentication and Cloud Firestore use a shared compatible BoM.
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
