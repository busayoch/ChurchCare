plugins { id 'com.android.application' }

android {
    namespace 'com.churchcare.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.churchcare.app'
        minSdk 23
        targetSdk 35
        versionCode 14
        versionName '0.7.0-foundation'
    }
}

dependencies {
    // 22.0.0 requires API 24; keep ChurchCare's existing API 23 minimum.
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
