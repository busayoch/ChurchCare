plugins { id 'com.android.application' }

android {
    namespace 'com.churchcare.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.churchcare.app'
        minSdk 23
        targetSdk 35
        versionCode 16
        versionName '0.7.2-foundation'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('CHURCHCARE_KEYSTORE_FILE')
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
            }
            storePassword System.getenv('CHURCHCARE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('CHURCHCARE_KEY_ALIAS')
            keyPassword System.getenv('CHURCHCARE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    // 22.0.0 requires API 24; keep ChurchCare's existing API 23 minimum.
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
