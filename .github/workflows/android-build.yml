name: ChurchCare Android Cloud Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '**/*.zip'
      - '.github/workflows/android-build.yml'
      - '.github/scripts/**'
      - '.github/assets/**'

permissions:
  contents: write

concurrency:
  group: churchcare-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build ChurchCare debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip' | grep -E '\.zip$' | head -n 1 || true)"
          if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::error::No source ZIP found. Upload the complete ChurchCare project ZIP to this repository, then push/commit it or run this workflow again."
            exit 1
          fi
          echo "Selected source archive: $ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/churchcare-source"
          unzip -q "${{ steps.source.outputs.zip_path }}" -d "$RUNNER_TEMP/churchcare-source"
          WRAPPER="$(find "$RUNNER_TEMP/churchcare-source" -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::The selected ZIP does not contain a Gradle wrapper (gradlew)."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Generate ChurchCare launcher icons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply-launcher-branding.py" "$project_dir"

      - name: Add Settings / About version menu
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/add-settings-about.py" "$project_dir"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find the preinstalled Android SDK sdkmanager."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          (yes | "$SDKMANAGER" --licenses) >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.project_dir }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$project_dir" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Gradle completed but no debug APK was found."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/churchcare-output"
          cp "$APK" "$RUNNER_TEMP/churchcare-output/ChurchCare-debug.apk"
          cd "$RUNNER_TEMP/churchcare-output"
          sha256sum ChurchCare-debug.apk > SHA256SUMS.txt

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChurchCare-debug-apk
          path: |
            ${{ runner.temp }}/churchcare-output/ChurchCare-debug.apk
            ${{ runner.temp }}/churchcare-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Android emulator launch smoke test
        id: launch-smoke-test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install -r "$RUNNER_TEMP/churchcare-output/ChurchCare-debug.apk"
            adb logcat -c
            adb shell am start -W -n com.churchcare.app/.MainActivity
            sleep 8
            if adb shell pidof com.churchcare.app >/dev/null 2>&1; then echo "ChurchCare remained running after launch."; else echo "::error::ChurchCare process exited after launch. AndroidRuntime log follows."; adb logcat -d -s AndroidRuntime:E ActivityTaskManager:E; exit 1; fi

      - name: Package updated source ZIP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_PARENT="$(dirname "$project_dir")"
          PROJECT_NAME="$(basename "$project_dir")"
          SOURCE_ZIP="$RUNNER_TEMP/churchcare-output/ChurchCare-0.6.8-Settings-About-Icon-Source.zip"
          cd "$PROJECT_PARENT"
          zip -qr "$SOURCE_ZIP" "$PROJECT_NAME" -x "$PROJECT_NAME/.gradle/*" "$PROJECT_NAME/**/build/*" "$PROJECT_NAME/**/.DS_Store"
          unzip -tq "$SOURCE_ZIP"

      - name: Commit updated source ZIP to main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_NAME="ChurchCare-0.6.8-Settings-About-Icon-Source.zip"
          cp "$RUNNER_TEMP/churchcare-output/$SOURCE_NAME" "$GITHUB_WORKSPACE/$SOURCE_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE_NAME"
          if git diff --cached --quiet; then
            echo "The committed source ZIP is already up to date; no new commit needed."
            exit 0
          fi
          git commit -m "Add ChurchCare 0.6.8 source ZIP with corrected icon"
          git push origin "HEAD:main"

      - name: Upload updated source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChurchCare-0.6.8-Settings-About-Icon-Source
          path: ${{ runner.temp }}/churchcare-output/ChurchCare-0.6.8-Settings-About-Icon-Source.zip
          if-no-files-found: error
          retention-days: 14
