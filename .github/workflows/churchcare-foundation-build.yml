name: ChurchCare Clean Foundation Build

on:
  push:
    branches:
      - rebuild/clean-android-foundation
    paths:
      - 'rebuild/android/**'
      - '.github/workflows/churchcare-foundation-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: churchcare-clean-foundation
  cancel-in-progress: true

jobs:
  build:
    name: Compile clean ChurchCare foundation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/clean-android-foundation

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's default 'tools platform-tools': the legacy 'tools' package no longer exists.
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare release signing key
        shell: bash
        env:
          CHURCHCARE_KEYSTORE_BASE64: ${{ secrets.CHURCHCARE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CHURCHCARE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$CHURCHCARE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/churchcare-release.jks"
          test -s "$RUNNER_TEMP/churchcare-release.jks"
          echo "CHURCHCARE_KEYSTORE_FILE=$RUNNER_TEMP/churchcare-release.jks" >> "$GITHUB_ENV"

      - name: Compile debug APK
        working-directory: rebuild/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Compile signed release APK
        working-directory: rebuild/android
        env:
          CHURCHCARE_KEYSTORE_FILE: ${{ runner.temp }}/churchcare-release.jks
          CHURCHCARE_KEYSTORE_PASSWORD: ${{ secrets.CHURCHCARE_KEYSTORE_PASSWORD }}
          CHURCHCARE_KEY_ALIAS: ${{ secrets.CHURCHCARE_KEY_ALIAS }}
          CHURCHCARE_KEY_PASSWORD: ${{ secrets.CHURCHCARE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signatures and report checksums
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="rebuild/android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="rebuild/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RELEASE_APK" | tee release-certificate.txt
          sha256sum "$DEBUG_APK" "$RELEASE_APK" | tee SHA256SUMS.txt
          echo "Both APK files compiled. Device/emulator launch is not yet verified."

      - name: Upload foundation APK
        uses: actions/upload-artifact@v4
        with:
          name: ChurchCare-clean-foundation-debug-apk
          path: |
            rebuild/android/app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChurchCare-signed-release-apk
          path: |
            rebuild/android/app/build/outputs/apk/release/app-release.apk
            release-certificate.txt
          if-no-files-found: error
          retention-days: 14
