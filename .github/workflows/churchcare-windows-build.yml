name: ChurchCare Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/windows-desktop-foundation
    paths:
      - 'rebuild/windows/**'
      - 'rebuild/assets/churchcare-original-icon.png.b64'
      - '.github/workflows/churchcare-windows-build.yml'

permissions:
  contents: read

concurrency:
  group: churchcare-windows-desktop-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Windows foundation
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin the build to the installed .NET 8 SDK
        shell: pwsh
        run: |
          Set-Content -Path global.json -Value '{ "sdk": { "version": "8.0.427", "rollForward": "latestPatch" } }'
          dotnet --version

      - name: Restore official ChurchCare icon
        shell: pwsh
        run: |
          $assetDir = "rebuild/windows/ChurchCare.Windows/Assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $encoded = (Get-Content "rebuild/assets/churchcare-original-icon.png.b64" -Raw) -replace '\s',''
          [IO.File]::WriteAllBytes("$assetDir/ChurchCare.png", [Convert]::FromBase64String($encoded))

      - name: Restore Windows desktop dependencies
        run: dotnet restore rebuild/windows/ChurchCare.Windows/ChurchCare.Windows.csproj

      - name: Publish native Windows application
        shell: pwsh
        run: dotnet publish rebuild/windows/ChurchCare.Windows/ChurchCare.Windows.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o "$env:GITHUB_WORKSPACE\publish\ChurchCare"

      - name: Show XAML compiler diagnostics if publish fails
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "rebuild/windows/ChurchCare.Windows/obj" -Recurse -Include input.json,output.json -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content $_.FullName
          }

      - name: Create conventional Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "rebuild/windows/installer/ChurchCare.iss" "/DPublishDir=$env:GITHUB_WORKSPACE\publish\ChurchCare" "/DOutputDir=$env:GITHUB_WORKSPACE\dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable application folder
        shell: pwsh
        run: |
          Compress-Archive -Path publish/ChurchCare/* -DestinationPath dist/ChurchCare-Windows-Portable.zip -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ChurchCare-Windows-Installer
          path: dist/ChurchCare-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: ChurchCare-Windows-Portable
          path: dist/ChurchCare-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
